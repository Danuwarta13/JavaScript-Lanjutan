<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Latihan Callbacks Movies-Rhinozzz</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <div class="container mx-auto px-2">
      <div class="flex mt-5 p-2">
        <div class="flex-1">
          <h1 class="text-4xl font-bold text-sky-500">Latihan Callbacks</h1>
        </div>
      </div>

      <div class="flex mt-2 p-2">
        <div class="flex-1">
          <h2 class="text-5xl font-semibold text-sky-500 text-center">Rhinozzz Moves</h2>
        </div>
      </div>

      <!-- Search Awal -->
      <div class="flex mt-2 p-2">
        <div class="flex-1">
          <div class="max-w-md mx-auto">
            <label for="search" class="sr-only">Search</label>
            <div class="flex rounded-md shadow-sm">
              <input
                type="text"
                id="search"
                class="input-key flex-1 min-w-0 block w-full px-3 py-2 rounded-none rounded-l-md border border-gray-200 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500"
                placeholder="Cari..."
              />
              <button type="button" class="search-button inline-flex items-center px-4 py-2 border border-1-0 border-gray-300 bg-gray-50 text-gray-700 rounded-r-md hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-sky-500">
                Search
              </button>
            </div>
          </div>
        </div>
      </div>
      <!-- Search Akhir -->

      <!-- Content Awal -->
      <div class="flex my-2">
        <!-- Pembungkus Card -->
        <div class="move-container flex flex-wrap my-2">
          <!-- Cards -->
        </div>
      </div>
      <!-- Content Akhir -->
    </div>

    <!-- Modal Awal -->

    <!-- Modal -->
    <div id="modal" class="hidden fixed inset-0 z-50 overflow-y-auto">
      <!-- Overlay -->
      <div class="fixed inset-0 bg-black/50"></div>

      <!-- Konten Modal -->
      <div class="flex items-center justify-center min-h-screen">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-2xl mx-auto z-50">
          <!-- Header -->
          <div class="flex justify-between items-center p-4 border-b">
            <h3 class="text-xl font-semibold">Details Moves</h3>
            <button onclick="closeModal()" class="text-gray-500 hover:text-gray-700 cursor-pointer">&times;</button>
          </div>

          <!-- Body -->
          <div class="modal-body p-2">
            <!-- isi modal -->
          </div>

          <!-- Footer -->
          <div class="flex justify-end p-4 border-t">
            <button onclick="closeModal()" class="px-4 py-2 bg-gray-200 rounded mr-2 cursor-pointer">Close</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal Akhirr -->

    <!-- JQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="script.js"></script>
  </body>
</html>
